<!DOCTYPE html>
<html lang="id" style="background-color:#0A0A0C;color-scheme:dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lintang — Skills</title>
    <style>html,body{background-color:#0A0A0C}</style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="/" class="logo"><span>Law</span>rencecil</a>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/skills" class="active">Skills</a>
            <a href="/projects">Projects</a>
            <a href="/blog">Blog</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <main>
        <section class="section">
            <h3 class="section-title">Keahlian</h3>
            <div class="skill">
                <div class="skill-name"><span>HTML &amp; CSS</span><span>85%</span></div>
                <div class="bar" style="--fill:85%"></div>
            </div>
            <div class="skill">
                <div class="skill-name"><span>Flask</span><span>85%</span></div>
                <div class="bar" style="--fill:85%"></div>
            </div>
            <div class="skill">
                <div class="skill-name"><span>JavaScript</span><span>40%</span></div>
                <div class="bar" style="--fill:40%"></div>
            </div>
            <div class="skill">
                <div class="skill-name"><span>Python</span><span>90%</span></div>
                <div class="bar" style="--fill:90%"></div>
            </div>
            <div class="skill">
                <div class="skill-name"><span>SQL</span><span>60%</span></div>
                <div class="bar" style="--fill:60%"></div>
            </div>
            <div class="skill">
                <div class="skill-name"><span>Git</span><span>80%</span></div>
                <div class="bar" style="--fill:80%"></div>
            </div>
        </section>

        <section class="section stagger">
            <h3 class="section-title">Statistik Cepat</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg></div>
                    <div class="number">3</div><div class="label">Semester</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
                    <div class="number">12+</div><div class="label">Proyek</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 5l-2 14"/></svg></div>
                    <div class="number">5</div><div class="label">Bahasa</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
                    <div class="number">∞</div><div class="label">Rasa Ingin Tahu</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 Lintang
    </footer>
</body>
</html>
